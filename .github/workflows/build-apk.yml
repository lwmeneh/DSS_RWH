name: Build GeoPond-DSS Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "DSS address (leave blank to use the default Streamlit Cloud URL)"
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write   # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      APP_URL: ${{ inputs.app_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing key (only if the secret is configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/geopond-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/geopond-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          URL_ARG=""
          if [ -n "$APP_URL" ]; then URL_ARG="-PappUrl=$APP_URL"; fi
          if [ "$HAS_KEYSTORE" = "true" ]; then
            gradle --no-daemon assembleRelease $URL_ARG
            APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          else
            echo "::warning::No signing key configured - building a DEBUG APK. Each build gets a new debug key, so users must uninstall the old version before installing a new one. Add the ANDROID_KEYSTORE_* secrets for updatable builds."
            gradle --no-daemon assembleDebug $URL_ARG
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          fi
          mkdir -p ../dist
          cp "$APK" "../dist/GeoPond-DSS-v2.2.${GITHUB_RUN_NUMBER}.apk"
          ls -la ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPond-DSS-APK
          path: dist/*.apk
          retention-days: 90

      - name: Publish GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v2.2.${{ github.run_number }}
          name: GeoPond-DSS Android v2.2.${{ github.run_number }}
          body: |
            GeoPond-DSS Android app (ICAR NEH).
            Download the .apk on the phone and open it to install (allow "Install unknown apps" when asked).
          files: dist/*.apk
